name: Build price site

on:
  schedule:
    - cron: "40 12 * * *"   # daily, after TCGplayer prices refresh, before the 9am NY post
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["site.py", "ptcg.py", ".github/workflows/site.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Today's price snapshot
        run: |
          python - <<'PY'
          import datetime as dt, ptcg
          if ptcg.load_snapshot(dt.date.today()) is None:
              snap = ptcg.snapshot()
              if snap:
                  ptcg.save_snapshot(snap)
                  print("saved", len(snap), "cards")
          PY
      - run: python site.py
      - name: Commit price history
        run: |
          git config user.name "pokehub-site-bot"
          git config user.email "pokehub-site-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Prices $(date -u +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
